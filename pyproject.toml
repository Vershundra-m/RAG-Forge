[project]
name = "rag-forge"
version = "0.1.0"
description = "General-purpose multi-backend RAG pipeline framework"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "google-generativeai>=0.8.6",
    "langchain-text-splitters>=1.1.2",
    "pinecone>=9.1.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.60.0",
    "tiktoken>=0.13.0",
]

[project.scripts]
rag-forge = "rag_forge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_forge"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
